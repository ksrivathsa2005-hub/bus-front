<header class="vintage-header" [class.authenticated]="isLoggedIn()">
  <div class="header-container">
    <!-- Logo Section -->
    <a routerLink="/" class="logo-section">
      <div class="logo-badge">
        <div class="badge-inner">
          <svg class="badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="6" width="18" height="12" rx="2" />
            <circle cx="7" cy="18" r="2" />
            <circle cx="17" cy="18" r="2" />
            <path d="M3 10h18" />
            <path d="M7 6V4a1 1 0 011-1h8a1 1 0 011-1v2" />
          </svg>
          <div class="badge-text">
            <span class="brand-name">Night Journey</span>
            <span class="brand-tagline">Est. 1952</span>
          </div>
        </div>
      </div>
    </a>

    @if (isLoggedIn()) {
    @if (currentUser$ | async; as user) {
    <!-- Greeting -->
    <div class="user-greeting">
      <span class="greeting-text">{{ greeting }},</span>
      <span class="user-name">{{ (user.fullName?.split(' ') ?? [])[0] || 'Traveler' }}</span>
    </div>
    }

    <!-- Navigation -->
    <nav class="main-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <span class="nav-text">Home</span>
      </a>
      <a routerLink="/my-bookings" routerLinkActive="active" class="nav-item">
        <span class="nav-text">My Bookings</span>
      </a>
      <a routerLink="/my-profile" routerLinkActive="active" class="nav-item">
        <span class="nav-text">Profile</span>
      </a>
      <a routerLink="/route-map" routerLinkActive="active" class="nav-item special">
        <span class="nav-text">Route Map</span>
      </a>
    </nav>

    <!-- Logout Button -->
    <button class="logout-btn" (click)="logout()">
      <span class="btn-text">Sign Out</span>
    </button>
    }
  </div>

  <!-- Decorative Bottom Border -->
  <div class="header-ornament">
    <div class="ornament-line"></div>
    <div class="ornament-diamond">&diams;</div>
    <div class="ornament-line"></div>
  </div>
</header>
